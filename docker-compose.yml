services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_ENV: ${APP_ENV:-local}
      MARIADB_SERVER: db
      MARIADB_PORT: "3306"
      MARIADB_USER: ${MARIADB_USER:-isms_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-isms_password}
      MARIADB_DB: ${MARIADB_DB:-isms_db}
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-before-deploy}
      ATTACHMENT_DIR: /app/uploads/ticket-attachments
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-isms-local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-isms-local-storage-dev}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ticket_attachments:/app/uploads/ticket-attachments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-isms-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-isms-local-storage-dev}
    volumes:
      - attachment_objects:/data

  db:
    image: mariadb:11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${MARIADB_DB:-isms_db}
      MARIADB_USER: ${MARIADB_USER:-isms_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-isms_password}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
  ticket_attachments:
  attachment_objects:
