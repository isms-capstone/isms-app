services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-isms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-isms_password}
      POSTGRES_DB: ${DB_NAME:-isms_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
