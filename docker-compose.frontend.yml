# Optional local frontend. Backend/database remain the existing services.
# docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.frontend.yml up -d --build frontend
services:
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://app:3000
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      BACKEND_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
