name: Deploy Staging Environment

on:
  push:
    branches:
      - develop

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to On-Prem Staging Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.ONPREM_HOST }}
          username: ${{ secrets.ONPREM_USER }}
          key: ${{ secrets.ONPREM_SSH_KEY }}
          port: ${{ secrets.ONPREM_SSH_PORT || 22 }}
          script: |
            cd /opt/isms-app
            git checkout develop
            git pull origin develop
            docker compose -p isms-staging -f docker-compose.yml -f docker-compose.staging.yml up -d --build
