name: Deploy Production Environment

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production  # ???????????????? GitHub Environment Protection Rules (?????? ?? Approve)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy & Migrate DB on On-Prem Production Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.ONPREM_HOST }}
          username: ${{ secrets.ONPREM_USER }}
          key: ${{ secrets.ONPREM_SSH_KEY }}
          port: ${{ secrets.ONPREM_SSH_PORT || 22 }}
          script: |
            set -eu
            cd /opt/isms-app
            git fetch origin main --tags
            git checkout --detach '${{ github.sha }}'
            bash scripts/deploy.sh prod '${{ github.sha }}'
