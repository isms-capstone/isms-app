name: Deploy Production Environment

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production  # ???????????????? GitHub Environment Protection Rules (?????? ?? Approve)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy & Migrate DB on On-Prem Production Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.ONPREM_HOST }}
          username: ${{ secrets.ONPREM_USER }}
          key: ${{ secrets.ONPREM_SSH_KEY }}
          port: ${{ secrets.ONPREM_SSH_PORT || 22 }}
          script: |
            cd /opt/isms-app
            git checkout main
            git pull origin main
            
            # Step 1: Run DB Migration ???????? container ???????????? ??? PRD
            docker compose -p isms-prod -f docker-compose.yml -f docker-compose.prod.yml run --rm app npm run migrate || echo "No migration script executed"
            
            # Step 2: Build & Deploy Production Containers
            docker compose -p isms-prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
